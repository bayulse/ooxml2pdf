[workspace]
members = ["crates/o2p-core", "crates/o2p-fonts", "crates/o2p-pdf", "crates/o2p-cli", "crates/o2p-ooxml", "crates/o2p-pptx"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
o2p-fonts = { path = "crates/o2p-fonts" }
harfrust = { version = "=0.14.0", default-features = false, features = ["std"] }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
unicode-segmentation = "=1.12.0"
unicode-script = "0.5.8"
unicode-bidi = "0.3.18"
o2p-core = { path = "crates/o2p-core" }
o2p-pdf = { path = "crates/o2p-pdf" }
o2p-ooxml = { path = "crates/o2p-ooxml" }
o2p-pptx = { path = "crates/o2p-pptx" }
roxmltree = "0.21.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5.2"
pdf-writer = "0.14"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
lopdf = { version = "0.38", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
